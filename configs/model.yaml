# Hierarchical Vision MoE configuration

backbone:
  # "mnv4_small" or "mnv4_medium" (MobileNetV4-style UIB stack)
  name: mnv4_small

training:
  image_size: 224
  batch_size: 128
  epochs_per_level: 30
  lr: 0.001
  weight_decay: 0.0001
  # Distillation from BioCLIP (teacher) — 0 disables KD
  distill_temperature: 4.0
  distill_alpha: 0.5

loss:
  # Per-level weights w_k (order, family, genus, species).
  # Higher weight on high-level errors (order >> species).
  level_weights: [8.0, 4.0, 2.0, 1.0]
  # Taxonomic cost-matrix strength
  lambda_cost: 1.0
  # Per-level loss type: "ce" or "focal" (focal recommended for genus/species long-tail)
  level_loss_types: [ce, ce, focal, focal]
  focal_gamma: 2.0
  focal_alpha: 0.25

routing:
  # Level-1 (order) confidence threshold: below it, keep Top-2 orders
  tau_order: 0.85
  # Per-level acceptance thresholds (order, family, genus, species)
  tau_levels: [0.85, 0.80, 0.70, 0.50]
  # Number of candidate orders when the router is unsure
  top_k_orders: 2
